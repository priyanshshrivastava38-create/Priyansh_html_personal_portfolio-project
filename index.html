<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Advanced Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #020617;
  --card: rgba(255,255,255,0.05);
  --text: #e5e7eb;
  --accent: #22d3ee;
  --neon: 0 0 20px #22d3ee;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: radial-gradient(circle at top, #020617, #000);
  color: var(--text);
  scroll-behavior: smooth;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  backdrop-filter: blur(15px);
  background: rgba(2,6,23,0.6);
  display: flex;
  justify-content: space-between;
  padding: 1rem 8%;
  z-index: 1000;
}

nav h1 {
  font-weight: 800;
  color: var(--accent);
}

nav ul {
  display: flex;
  gap: 1.5rem;
  list-style: none;
}

nav li {
  cursor: pointer;
  position: relative;
}

nav li::after {
  content: "";
  position: absolute;
  width: 0;
  height: 2px;
  bottom: -5px;
  left: 0;
  background: var(--accent);
  transition: 0.3s;
}

nav li:hover::after {
  width: 100%;
}

/* SECTIONS */
section {
  min-height: 100vh;
  padding: 7rem 10%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero h2 {
  font-size: 3rem;
}

.hero span {
  color: var(--accent);
  text-shadow: var(--neon);
}

.hero p {
  max-width: 600px;
  margin-top: 1rem;
  opacity: 0.8;
}

/* BUTTON */
.btn {
  margin-top: 2rem;
  padding: 0.8rem 1.5rem;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  border-radius: 30px;
  cursor: pointer;
  transition: 0.4s;
}

.btn:hover {
  background: var(--accent);
  color: #020617;
  box-shadow: var(--neon);
  transform: scale(1.05);
}

/* CARDS */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 2rem;
}

.card {
  background: var(--card);
  padding: 2rem;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.5s;
  transform-style: preserve-3d;
}

.card:hover {
  transform: translateY(-15px) rotateX(8deg);
  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

.card h3 {
  color: var(--accent);
  margin-bottom: 0.5rem;
}

/* SKILLS */
.skill {
  display: inline-block;
  padding: 0.5rem 1rem;
  margin: 0.3rem;
  border-radius: 20px;
  background: rgba(34,211,238,0.1);
  border: 1px solid var(--accent);
  transition: 0.3s;
}

.skill:hover {
  background: var(--accent);
  color: #020617;
  box-shadow: var(--neon);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 2rem;
  opacity: 0.6;
}
</style>
</head>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState } = React;

function Navbar() {
  return (
    <nav>
      <h1>PORTFOLIO</h1>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
      </ul>
    </nav>
  );
}

function Hero() {
  return (
    <section id="home" className="hero">
      <h2>Hi, I'm <span>John Doe</span></h2>
      <p>
        I build high-performance, visually stunning web experiences using
        HTML, CSS, JavaScript & React.
      </p>
      <button className="btn">View My Work</button>
    </section>
  );
}

function Skills() {
  const skills = ["HTML5","CSS3","JavaScript","React","UI/UX","Animations","Git"];
  return (
    <section id="skills">
      <h2>Skills</h2>
      <div>
        {skills.map(s => <span key={s} className="skill">{s}</span>)}
      </div>
    </section>
  );
}

function Projects() {
  return (
    <section id="projects">
      <h2>Projects</h2>
      <div className="grid">
        <div className="card">
          <h3>Neon Portfolio</h3>
          <p>Advanced portfolio with 3D hover & animations.</p>
        </div>
        <div className="card">
          <h3>React Dashboard</h3>
          <p>Interactive dashboard using React state.</p>
        </div>
        <div className="card">
          <h3>Landing Page</h3>
          <p>High-conversion landing page with CSS effects.</p>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return <footer>© 2025 John Doe — Built with React</footer>;
}

function App() {
  return (
    <>
      <Navbar />
      <Hero />
      <Skills />
      <Projects />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
